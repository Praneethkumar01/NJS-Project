<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Dashboard - Community Food Bank</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->
    <header>

        <div class="logo">
            🌱 Community Food Bank
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <button onclick="logoutUser()">
                Logout
            </button>

        </nav>

    </header>



    <!-- Dashboard -->
    <main class="dashboard">

        <h1 class="welcome-user">
    Welcome!
</h1>

        <p>
            You are logged in as a
            <strong id="userRole">Farmer</strong>.
        </p>


        <!-- Account Information -->
        <div class="dashboard-card">

    <h2>My Account</h2>

    <p>
        <strong>Name:</strong>
        <span class="logged-user-name"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span class="logged-user-email"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span class="logged-user-role"></span>
    </p>

</div>


        <!-- Farmer Services -->
        <div class="dashboard-card">

            <h2>Farmer Services</h2>

            <p>
                Manage your agricultural produce and
                contribute fresh food to the community.
            </p>


            <button
                class="dashboard-btn"
                onclick="alert('Produce management feature coming soon!')"
            >
                Manage Produce
            </button>


            <button
                class="dashboard-btn"
                onclick="alert('Donation feature coming soon!')"
            >
                Donate Produce
            </button>

        </div>

    </main>



    <!-- Footer -->
    <footer>

        <p>
            © 2026 Community Food Bank
        </p>

    </footer>



    <script src="script.js"></script>

</body>
</html>
