<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Member - Community Food Bank</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="logo">
            🌱 Community Food Bank
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart 🛒</a>

            <button onclick="logoutUser()">
                Logout
            </button>
        </nav>

    </header>


    <!-- Dashboard -->
    <main class="dashboard">

        <h1 class="welcome-user">
            Welcome!
        </h1>

        <p>
            You are logged in as a
            <strong id="userRole">Community Member</strong>.
        </p>


        <!-- User Information -->
        <div class="dashboard-card">

    <h2>My Account</h2>

    <p>
        <strong>Name:</strong>
        <span class="logged-user-name"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span class="logged-user-email"></span>
    </p>

    <p>
        <strong>Role:</strong>
        <span class="logged-user-role"></span>
    </p>

</div>


        <!-- Community Member Options -->
        <div class="dashboard-card">

            <h2>Community Services</h2>

            <p>
                Browse available food and request food items
                from the community food bank.
            </p>

            <a href="index.html" class="dashboard-btn">
                Browse Food
            </a>

            <a href="cart.html" class="dashboard-btn">
                View Cart 🛒
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Community Food Bank
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
