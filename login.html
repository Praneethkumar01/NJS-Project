<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Community Food Bank</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-body">


    <!-- Header -->
    <header>

        <div class="logo">
            🌱 Community Food Bank
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="registration.html">
                Register
            </a>

        </nav>

    </header>



    <!-- Login Section -->
    <div class="auth-container">

        <div class="auth-box">

            <h2>Login</h2>

            <p class="auth-subtitle">
                Login to access your account
            </p>


            <!-- Login Form -->
            <form id="loginForm">


                <!-- Email -->
                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="email"
                    placeholder="Enter your email"
                    required
                >



                <!-- Password -->
                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >



                <!-- Remember Me -->
                <div class="remember">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                </div>



                <!-- Login Message -->
                <p id="loginMessage"></p>



                <!-- Login Button -->
                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


            </form>



            <!-- Registration Link -->
            <p class="account-link">

                Don't have an account?

                <a href="registration.html">
                    Register here
                </a>

            </p>


        </div>

    </div>



    <!-- Footer -->
    <footer>

        <p>
            © 2026 Community Food Bank
        </p>

    </footer>



    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
